<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#030712" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald / Cyan Gradient for Primary Link -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Glow Gradient for Accent Link -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Flame / Streak Accent Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle Circular Guide Aura (Safe Zone for Twitter Profile Pic) -->
  <circle cx="400" cy="400" r="380" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 8"/>
  <circle cx="400" cy="400" r="320" fill="#10b981" fill-opacity="0.03" filter="url(#neonGlow)"/>

  <!-- Logo Group -->
  <g transform="translate(400, 400)">
    <!-- Ambient Behind Glow -->
    <ellipse cx="0" cy="0" rx="220" ry="220" fill="#10b981" fill-opacity="0.18" filter="url(#neonGlow)"/>

    <!-- Left Chain Loop (Emerald) -->
    <path d="M -80 -140
             C -160 -140 -220 -80 -220 0
             C -220 80 -160 140 -80 140
             C -30 140 10 115 40 80
             L -10 35
             C -25 55 -50 70 -80 70
             C -120 70 -150 35 -150 0
             C -150 -35 -120 -70 -80 -70
             C -50 -70 -25 -55 -10 -35
             L 40 -80
             C 10 -115 -30 -140 -80 -140 Z"
          fill="url(#primaryGrad)"
          filter="url(#neonGlow)"/>

    <!-- Right Interlocking Chain Loop (Cyan to Emerald) with Ascending Streak / Check Peak -->
    <path d="M 80 140
             C 160 140 220 80 220 0
             C 220 -80 160 -140 80 -140
             C 30 -140 -10 -115 -40 -80
             L 10 -35
             C 25 -55 50 -70 80 -70
             C 120 -70 150 -35 150 0
             C 150 35 120 70 80 70
             C 50 70 25 55 10 35
             L -40 80
             C -10 115 30 140 80 140 Z"
          fill="url(#cyanGrad)"
          filter="url(#neonGlow)"/>

    <!-- Central Verifiable Checkmark Integration (Neon Emerald/White Core) -->
    <g filter="url(#coreGlow)">
      <path d="M -75 5 L -10 70 L 105 -55"
            fill="none"
            stroke="#ffffff"
            stroke-width="32"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M -75 5 L -10 70 L 105 -55"
            fill="none"
            stroke="#34d399"
            stroke-width="24"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Momentum Flame / Spark Sparks at Apex -->
    <circle cx="160" cy="-140" r="14" fill="#a7f3d0" filter="url(#coreGlow)"/>
    <circle cx="-160" cy="140" r="10" fill="#38bdf8" filter="url(#coreGlow)"/>
    <circle cx="195" cy="-90" r="7" fill="#67e8f9" opacity="0.8"/>
  </g>
</svg>

